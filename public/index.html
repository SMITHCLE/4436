<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sunrise Bakery - Promotions</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <img src="/images/logo.png" alt="Sunrise Bakery logo" width="100">
    <h1>Sunrise Bakery</h1>
    <p>Fresh bread, fresh deals.</p>
  </header>
  <main>
    <h2>This week's promotions</h2>
    <ul>
      <li>Free coffee with any pastry before 9am</li>
      <li>Buy 2 loaves, get 1 free on Saturdays</li>
    </ul>
    <p>Subscribers get access to <a href="/deals">exclusive deals</a>.</p>
    <h2 id="subscribe">Subscribe</h2>
    <form method="POST" action="/subscribe">
      <p><label>Name <input type="text" name="name" required></label></p>
      <p><label>Email <input type="email" name="email" required></label></p>
      <button type="submit">Subscribe</button>
    </form>
  </main>
</body>
</html>
