<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Returning customers - Sunrise Bakery</title><link rel="stylesheet" href="/style.css"></head>
<body>
  <header>
    <img src="/images/logo.png" alt="Sunrise Bakery logo" width="100">
    <h1>Welcome back!</h1>
    <p>Log in with the email you subscribed with to claim your rewards.</p>
  </header>
  <main>
    <form method="POST" action="/login">
      <p><label>Email <input type="email" name="email" required></label></p>
      <button type="submit">Log in</button>
    </form>
    <p>New here? <a href="/#subscribe">Subscribe first</a>.</p>
  </main>
</body>
</html>
